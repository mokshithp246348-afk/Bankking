# ===================================================================
# Banking Management System - Production Configuration
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Information
spring.application.name=Banking Management System

# ===================================================================
# MySQL Database Connectivity (Production JDBC)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:8081/banking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# Hibernate & JPA Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=INFO
logging.level.com.bank.app=INFO
logging.level.org.springframework.security=WARN

# ===================================================================
# Jackson JSON Configuration
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
